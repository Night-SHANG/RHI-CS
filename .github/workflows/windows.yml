name: Windows development build
on:
  push:
    branches: [main, 'development/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static manifest and localization checks
        run: |
          python tools/check_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_baseline_busy_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_baseline_layout_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_protection_record_source.py
      - name: Test deployment and recovery against temporary directories
        run: dotnet test tests/Rhi.Core.Tests/Rhi.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests
      - name: Publish self-contained WinUI application
        run: dotnet publish src/Rhi.App/Rhi.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/app -bl:artifacts/winui.binlog
      - name: Verify published language resources and license
        run: python tools/check_sources.py --published artifacts/app
      - name: Prepare isolated UI fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- zh-CN
      - name: Capture WinUI states and check UI interactions
        run: powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui
      - name: Prepare interrupted configuration fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --pending-configuration
      - name: Verify pending configuration locks and recovery UI
        run: powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-pending -PendingConfiguration
      - name: Prepare feature integration fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --features artifacts/feature-context.json
      - name: Verify inspection management batch and protection UI
        run: powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-features -Features -FixtureMetadata artifacts/feature-context.json
      - name: Verify feature results against files and receipts
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-features artifacts/feature-context.json
      - name: Prepare moved game fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --relocation artifacts/relocation-context.json
      - name: Verify relocation forms and related states
        run: powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-relocation -Relocation -FixtureMetadata artifacts/relocation-context.json
      - name: Verify relocated files and records after restart
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-relocation artifacts/relocation-context.json
      - name: Prepare isolated visual fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --visual
      - name: Verify theme layout and available display scales
        run: |
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --offline artifacts/offline-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-visual -Visual -FixtureMetadata artifacts/offline-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-offline artifacts/offline-context.json
      - name: Prepare and verify complete Data migration UI
        run: |
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --migration artifacts/migration-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-migration -Migration -FixtureMetadata artifacts/migration-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-migration artifacts/migration-context.json
      - name: Verify migration restart continuation in dark English UI
        run: |
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --migration-interrupted artifacts/migration-resume.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-migration-resume -Migration -FixtureMetadata artifacts/migration-resume.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-migration artifacts/migration-resume.json
      - name: Prepare and verify library usability fixture
        run: |
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --usability artifacts/usability-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-usability -Usability -FixtureMetadata artifacts/usability-context.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-usability artifacts/usability-context.json
      - name: Prepare disconnected startup fixture
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --startup artifacts/startup-context.json artifacts/app
      - name: Verify explicit fresh start and cancellation
        run: powershell.exe -NoProfile -File tools/ci_ui_smoke.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/ui-startup -Startup
      - name: Verify fresh workspace and retain fixture outside package
        run: dotnet run --project tests/Rhi.UiSmoke.Seed/Rhi.UiSmoke.Seed.csproj -c Release -- --verify-startup artifacts/startup-context.json
      - name: Upload outputs to a draft Release
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RHI_BUILD_STATUS: ${{ job.status }}
        run: python tools/release/publish_draft.py development
