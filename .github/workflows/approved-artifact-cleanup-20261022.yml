# One-time user-approved fixed-ID cleanup. No product source or existing workflow changes.
# Approved manifest SHA256: 18a06606961da035bacb3ba69b34f7af4417034f9fe25c88c98cbecbbeb77284
name: Approved artifact cleanup 20261022
run-name: Approved fixed artifact IDs only / 18a06606
'on':
  create: null
permissions: {}
concurrency:
  group: approved-artifact-cleanup-20261022
  cancel-in-progress: false
jobs:
  delete-approved-artifacts:
    if: github.event_name == 'create' && github.repository == 'Night-SHANG/RHI-CS' && github.event.repository.private == true && github.event.ref == 'maintenance/approved-artifacts-20261022-18a06606' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/maintenance/approved-artifacts-20261022-18a06606' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
    - name: Validate one-time branch creation
      shell: bash
      env:
        RUN_WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: "python - <<'PY'\nimport datetime,json,os,re\ndef validate_context(env,event,expected_repo,now=None):\n    expected_branch='maintenance/approved-artifacts-20261022-18a06606'\n    expected_path='.github/workflows/approved-artifact-cleanup-20261022.yml'\n    exact={'GITHUB_ACTIONS':'true','GITHUB_EVENT_NAME':'create','GITHUB_REPOSITORY':expected_repo,\n           'GITHUB_REF':'refs/heads/'+expected_branch,'GITHUB_RUN_ATTEMPT':'1',\n           'RUN_WORKFLOW_REF':expected_repo+'/'+expected_path+'@refs/heads/'+expected_branch}\n    for key,value in exact.items():\n        if env.get(key)!=value: raise ValueError('Unexpected execution context: '+key)\n    if not re.fullmatch('[a-f0-9]{40}',env.get('GITHUB_SHA','')):raise ValueError('Invalid SHA')\n    if env.get('RUN_WORKFLOW_SHA')!=env['GITHUB_SHA']:raise ValueError('Workflow/source SHA mismatch')\n    if not re.fullmatch('[1-9][0-9]*',env.get('GITHUB_RUN_ID','')):raise ValueError('Invalid run ID')\n    if event.get('ref')!=expected_branch or event.get('ref_type')!='branch':raise ValueError('Not the approved branch creation')\n    if event.get('repository',{}).get('full_name')!=expected_repo or event.get('repository',{}).get('private') is not True:raise ValueError('Repository mismatch')\n    now=now or datetime.datetime.now(datetime.timezone.utc)\n    if not datetime.datetime(2026,10,22,16,tzinfo=datetime.timezone.utc)<=now<datetime.datetime(2026,10,23,4,tzinfo=datetime.timezone.utc):raise ValueError('One-time execution window closed')\n\nvalidate_context(os.environ,json.load(open(os.environ[\"GITHUB_EVENT_PATH\"])),'Night-SHANG/RHI-CS')\nprint(\"Approved isolated branch-creation context validated.\")\nPY\n"
    - name: Reconstruct integrity-pinned cleanup payload
      shell: bash
      env:
        MANIFEST_PAYLOAD: 
        RUNNER_PAYLOAD: 
        MANIFEST_SHA256: 18a06606961da035bacb3ba69b34f7af4417034f9fe25c88c98cbecbbeb77284
        RUNNER_SHA256: 1d3266dda078eb69cd0a660ed454a4bdd8ef2c96b77b04b956a9346da0461104
      run: "python - <<'PY'\nimport base64,hashlib,os,pathlib,zlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'approved-artifact-cleanup'\np.mkdir(mode=0o700,exist_ok=False)\nfor key,name,expected in [('MANIFEST_PAYLOAD','proposed-delete-manifest.json',os.environ['MANIFEST_SHA256']),('RUNNER_PAYLOAD','artifact_cleanup.py',os.environ['RUNNER_SHA256'])]:\n    data=zlib.decompress(base64.b64decode(os.environ[key],validate=True))\n    if hashlib.sha256(data).hexdigest()!=expected:raise SystemExit('Payload integrity mismatch')\n    (p/name).write_bytes(data)\nprint('Pinned runner and approved manifest reconstructed with SHA256 verification.')\nPY\n"
    - name: Verify entire fixed list, delete only matching IDs, confirm absence
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: 'set +x

        set -euo pipefail

        python "$RUNNER_TEMP/approved-artifact-cleanup/artifact_cleanup.py" --manifest "$RUNNER_TEMP/approved-artifact-cleanup/proposed-delete-manifest.json" --repository "$GITHUB_REPOSITORY" --execute --report "$RUNNER_TEMP/artifact-cleanup-report.json"

        '
