name: Deployment versus system copy
on:
  push:
    branches: ['development/**']
    paths: ['src/Rhi.Core/**', 'tests/Rhi.Performance/**', 'tools/release/**', '.github/workflows/performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Measure system copy and application on the same fixture
        run: dotnet run --project tests/Rhi.Performance -c Release -- artifacts/performance/current.json ${{ github.sha }}
      - name: Upload measurements to a draft Release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RHI_BUILD_STATUS: ${{ job.status }}
        run: python tools/release/publish_draft.py performance
