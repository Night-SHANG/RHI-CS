name: Deployment versus system copy
on:
  push:
    branches: ['development/**']
    paths: ['src/Rhi.Core/**', 'tests/Rhi.Performance/**', '.github/workflows/performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Measure system copy and application on the same fixture
        run: dotnet run --project tests/Rhi.Performance -c Release -- artifacts/performance/current.json ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RHI-CS-performance
          path: artifacts/performance/
