<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690">
  <rect width="1120" height="690" fill="#eff2f6"/>
  <g font-family="Microsoft YaHei UI,Segoe UI,sans-serif" fill="#17223d">
    <text x="32" y="36" font-size="22" font-weight="600">资源库与版本 · 短标签与明确的路径规则</text>
    <text x="32" y="64" font-size="13" fill="#53627d">结构样板（非运行截图）：统一弹窗；正文可滚动；底部按钮固定、等宽；不再选择资源类型。</text>
    <rect x="32" y="88" width="520" height="550" rx="8" fill="white" stroke="#d1d5dc"/>
    <rect x="568" y="88" width="520" height="550" rx="8" fill="white" stroke="#d1d5dc"/>
    <g font-size="14">
      <text x="56" y="128" font-size="22">添加资源库</text>
      <text x="56" y="196">资源库名称</text>
      <rect x="56" y="206" width="472" height="34" rx="4" fill="#fff" stroke="#d5d5d5"/>
      <text x="68" y="229">游戏资源</text>
      <text x="56" y="274">部署子目录</text>
      <rect x="56" y="284" width="472" height="34" rx="4" fill="#fff" stroke="#d5d5d5"/>
      <text x="68" y="307" fill="#697386">例如 mods\textures</text>
      <text x="56" y="346">留空使用游戏部署目录。</text>
      <text x="56" y="369">子目录不存在时，部署时自动创建。</text>
      <text x="56" y="415" fill="#53627d">保存不会部署文件。</text>
      <text x="592" y="128" font-size="22">添加版本</text>
      <text x="592" y="164">版本名称</text>
      <rect x="592" y="174" width="472" height="34" rx="4" fill="#fff" stroke="#d5d5d5"/>
      <text x="604" y="197">1.0</text>
      <text x="592" y="238">资源文件目录</text>
      <rect x="592" y="248" width="472" height="34" rx="4" fill="#fff" stroke="#d5d5d5"/>
      <text x="604" y="271">F:\资源库\素材</text>
      <rect x="592" y="294" width="232" height="36" rx="4" fill="#fafafa" stroke="#dedede"/>
      <rect x="832" y="294" width="232" height="36" rx="4" fill="#fafafa" stroke="#dedede"/>
      <text x="708" y="318" text-anchor="middle">选择文件夹</text>
      <text x="948" y="318" text-anchor="middle">选择文件</text>
      <text x="592" y="356">复制文件夹内的内容或所选文件，来源保持不变。</text>
      <text x="592" y="396">部署子目录</text>
      <rect x="592" y="422" width="472" height="34" rx="4" fill="#fff" stroke="#d5d5d5"/>
      <text x="604" y="445" fill="#697386">例如 mods\textures</text>
      <text x="592" y="480">留空沿用资源库设置；子目录在部署时创建。</text>
      <text x="592" y="503">沿用资源库：游戏部署目录\mods</text>
      <text x="592" y="526" fill="#53627d">保存不会部署文件。</text>
      <path d="M32 554H552M568 554H1088" stroke="#e5e5e5"/>
      <rect x="56" y="578" width="232" height="36" rx="4" fill="#fafafa" stroke="#dedede"/>
      <rect x="296" y="578" width="232" height="36" rx="4" fill="#005fa8"/>
      <rect x="592" y="578" width="232" height="36" rx="4" fill="#fafafa" stroke="#dedede"/>
      <rect x="832" y="578" width="232" height="36" rx="4" fill="#005fa8"/>
      <text x="172" y="602" text-anchor="middle">取消</text>
      <text x="412" y="602" text-anchor="middle" fill="white">保存</text>
      <text x="708" y="602" text-anchor="middle">取消</text>
      <text x="948" y="602" text-anchor="middle" fill="white">保存</text>
      <text x="32" y="670" fill="#53627d">正常状态不显示校验说明；错误区预留高度，按钮不移动。实际弹窗按内容与窗口缩放，不照搬画布高度。</text>
    </g>
  </g>
</svg>
