<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
 <rect width="1440" height="1050" fill="#eff2f6"/>
 <g font-family="Microsoft YaHei UI,Segoe UI,sans-serif" fill="#17223d" font-size="14">
 <text x="28" y="35" font-size="24" font-weight="600">使用反馈整批修正 · 结构样板 r5</text>
 <text x="28" y="61" fill="#53627d">保留统一浅色、卡片边框、字体层级、等宽按钮与固定弹窗底栏；实际高度依窗口调整，窄窗口保留滚动。</text>
 <rect x="24" y="84" width="1392" height="248" rx="8" fill="white" stroke="#d1d5dc"/>
 <text x="48" y="119" font-size="22">游戏 · 本地资源</text>
 <rect x="48" y="137" width="1344" height="36" fill="#f1f4f8"/>
 <rect x="62" y="146" width="18" height="18" rx="3" fill="white" stroke="#8993a0"/><text x="116" y="161">资源库名称（表头复选框全选）</text><text x="420" y="161">版本名称</text><text x="780" y="161">状态</text><text x="1010" y="161">操作</text>
 <rect x="62" y="190" width="18" height="18" rx="3" fill="white" stroke="#8993a0"/>
 <text x="116" y="206">材质资源</text><text x="320" y="196">当前版本：v1</text>
 <rect x="320" y="206" width="400" height="34" rx="4" fill="white" stroke="#d1d5dc"/><text x="332" y="229">v2（候选）</text><text x="698" y="229">⌄</text>
 <text x="780" y="206" fill="#16843e">● 已部署</text><text x="780" y="232" fill="#53627d">● 尚未核对</text>
 <g fill="white" stroke="#d1d5dc"><rect x="1010" y="188" width="116" height="36" rx="4"/><rect x="1134" y="188" width="116" height="36" rx="4"/><rect x="1258" y="188" width="116" height="36" rx="4"/></g>
 <text x="1040" y="211">更换版本</text><text x="1164" y="211">清除部署</text><text x="1288" y="211">查看差异</text>
 <text x="48" y="285" fill="#53627d">表头支持全选／部分选中；数量按可执行对象分别显示，所有操作先预检。</text>
 <rect x="982" y="277" width="192" height="36" rx="4" fill="#0067b4"/><text x="1000" y="301" fill="white">部署／换版（2）</text><rect x="1182" y="277" width="192" height="36" rx="4" fill="white" stroke="#d1d5dc"/><text x="1200" y="301">清除部署（1）</text>
 <rect x="24" y="352" width="440" height="666" rx="8" fill="white" stroke="#d1d5dc"/>
 <text x="48" y="390" font-size="22">添加游戏</text>
 <text x="48" y="428">游戏名称</text><rect x="48" y="438" width="392" height="34" rx="4" fill="white" stroke="#d1d5dc"/>
 <text x="48" y="498">游戏 EXE</text><rect x="48" y="508" width="268" height="34" rx="4" fill="white" stroke="#d1d5dc"/><rect x="324" y="508" width="116" height="34" rx="4" fill="white" stroke="#d1d5dc"/><text x="343" y="530">选择游戏 EXE</text>
 <text x="48" y="568">游戏安装目录</text><rect x="48" y="578" width="392" height="34" rx="4" fill="white" stroke="#d1d5dc"/>
 <text x="48" y="638">部署目录</text><rect x="48" y="648" width="392" height="34" rx="4" fill="white" stroke="#d1d5dc"/>
 <text x="48" y="708">图形 API</text><rect x="48" y="718" width="392" height="34" rx="4" fill="white" stroke="#d1d5dc"/><text x="60" y="742">DirectX 10/11/12</text>
 <text x="48" y="790" fill="#53627d">按实际内容测量高度，避免人为截断 API。</text><text x="48" y="820" fill="#53627d">正文提示与校验区留在按钮上方。</text>
 <rect x="25" y="938" width="438" height="79" fill="#f5f5f5"/><rect x="48" y="960" width="192" height="36" rx="4" fill="white" stroke="#d1d5dc"/><rect x="248" y="960" width="192" height="36" rx="4" fill="#0067b4"/><text x="130" y="984">取消</text><text x="330" y="984" fill="white">保存</text>
 <rect x="484" y="352" width="448" height="666" rx="8" fill="white" stroke="#d1d5dc"/>
 <text x="508" y="390" font-size="22">添加资源库</text><text x="508" y="428">资源库名称</text><rect x="508" y="438" width="400" height="34" rx="4" fill="white" stroke="#d1d5dc"/>
 <text x="508" y="500">资源库目录</text><rect x="508" y="510" width="400" height="34" rx="4" fill="white" stroke="#d1d5dc"/><text x="520" y="532">F:\资源库\材质资源</text>
 <rect x="508" y="554" width="400" height="36" rx="4" fill="white" stroke="#d1d5dc"/><text x="673" y="577">浏览文件夹</text>
 <text x="508" y="620" fill="#53627d">添加版本时从此目录选择，不搬动现有文件。</text>
 <text x="508" y="664">部署子目录</text><rect x="508" y="674" width="400" height="34" rx="4" fill="white" stroke="#d1d5dc"/><text x="520" y="696">例如 mods\textures</text>
 <text x="508" y="738" fill="#53627d">留空使用游戏部署目录；部署时创建子目录。</text><text x="508" y="774" fill="#53627d">保存不会部署文件。</text><text x="508" y="820" fill="#53627d">名称为空时点击保存，才显示名称提示。</text>
 <rect x="485" y="938" width="446" height="79" fill="#f5f5f5"/><rect x="508" y="960" width="196" height="36" rx="4" fill="white" stroke="#d1d5dc"/><rect x="712" y="960" width="196" height="36" rx="4" fill="#0067b4"/><text x="590" y="984">取消</text><text x="794" y="984" fill="white">保存</text>
 <rect x="952" y="352" width="464" height="308" rx="8" fill="white" stroke="#d1d5dc"/><text x="976" y="390" font-size="22">版本详情 · 弹窗</text>
 <text x="976" y="432">材质资源 · v2</text><text x="976" y="470">资源文件目录：F:\资源库\材质资源\v2</text><text x="976" y="506">部署位置：游戏部署目录\mods</text>
 <g fill="white" stroke="#d1d5dc"><rect x="976" y="550" width="204" height="36" rx="4"/><rect x="1188" y="550" width="204" height="36" rx="4"/></g><text x="1062" y="574">修改</text><text x="1260" y="574">移除版本</text><text x="976" y="622" fill="#53627d">底部关闭；列表行另设查看与移除，不重建左栏。</text>
 <rect x="952" y="680" width="464" height="338" rx="8" fill="white" stroke="#d1d5dc"/><text x="976" y="720" font-size="22">文件差异 · 只读</text><text x="976" y="764">材质资源 · v1</text><text x="976" y="802">texture.dds · 目标一致</text><text x="976" y="840">config.ini · 目标已变化</text><text x="976" y="888" fill="#53627d">移除后续操作下拉框，部署操作保留在游戏页。</text><text x="976" y="926" fill="#53627d">统计保护副本仅刷新统计区，保留设置页草稿。</text>
 <rect x="976" y="960" width="416" height="36" rx="4" fill="white" stroke="#d1d5dc"/><text x="1170" y="984">关闭</text>
 </g>
</svg>
