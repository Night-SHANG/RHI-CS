<text x="28" y="875" class="title">同类状态规则</text>
<text x="28" y="910">表单：初次打开不显示必填错误；按保存后校验，后续编辑实时更新错误。错误区与底栏位置固定。</text>
<text x="28" y="940">目录入口：游戏部署目录、资源库目录、版本资源目录分别打开对应路径；不存在时禁用并给出提示。</text>
<text x="28" y="970">批量操作：按选中动作显示“部署 / 更换版本 / 部署与更换版本”，清除为独立按钮；不改变原预检规则。</text>
<text x="28" y="1000">保护副本：游戏名 / 资源库名 / 时间__唯一编号 / 原版本名 / 文件；备份说明.txt 与原版本文件夹同级。</text>
</svg>
