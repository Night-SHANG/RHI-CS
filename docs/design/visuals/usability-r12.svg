<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770">
<title>RHI-CS r12 局部视觉样板：直接修改版本、资源库总目录、默认折叠预检。示例状态，尚未实现。</title>
<defs><style>
