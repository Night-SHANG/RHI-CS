<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800"><rect width="1120" height="800" fill="#f3f7fc"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="30" y="35" font-size="25" fill="#16213e">RHI-CS · ReShade</text><rect x="30" y="60" width="510" height="710" rx="6" fill="#fff" stroke="#d7e0ed"/><path d="M30,125h510 M30,690h510" stroke="#d7e0ed"/><rect x="580" y="60" width="510" height="710" rx="6" fill="#fff" stroke="#d7e0ed"/><path d="M580,125h510 M580,690h510" stroke="#d7e0ed"/><text x="54" y="101" font-size="22" fill="#16213e">添加版本</text><text x="54" y="150" font-size="14" fill="#16213e">版本标签</text><rect x="54" y="162" width="462" height="38" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="66" y="187" font-size="14" fill="#16213e">6.8</text><text x="54" y="225" font-size="14" fill="#16213e">资源类型</text><rect x="54" y="237" width="462" height="38" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="66" y="262" font-size="14" fill="#16213e">ReShade 普通版  ▾</text><text x="54" y="300" font-size="14" fill="#16213e">来源路径</text><rect x="54" y="312" width="462" height="38" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="66" y="337" font-size="14" fill="#16213e">D:\LocalResources\ReShade_Setup.exe</text><text x="54" y="420" font-size="14" fill="#16213e">本版本目标覆盖（留空沿用资源库）</text><rect x="54" y="432" width="462" height="38" rx="6" fill="#edf1f6" stroke="#d7e0ed"/><text x="66" y="457" font-size="14" fill="#16213e"></text><rect x="54" y="367" width="110" height="34" rx="6" fill="#edf1f6" stroke="#d7e0ed"/><text x="70" y="390" font-size="14" fill="#8894a8">选择目录</text><rect x="176" y="367" width="110" height="34" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="192" y="390" font-size="14" fill="#16213e">选择文件</text><text x="54" y="500" font-size="13" fill="#596883">ReShade 必须部署到已确认的游戏部署目录；</text><text x="54" y="524" font-size="13" fill="#596883">此版本不能另设目标子目录。</text><text x="54" y="548" font-size="13" fill="#596883">保存仅记录配置；部署前会校验位数并预览 INI 改动，</text><text x="54" y="572" font-size="13" fill="#596883">不会运行源安装器。</text><text x="54" y="596" font-size="13" fill="#596883">补充必要路径时会重排 INI 格式并省略注释，</text><text x="54" y="620" font-size="13" fill="#596883">原文件可由备份恢复。</text><rect x="292" y="710" width="100" height="38" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="328" y="735" font-size="14" fill="#16213e">取消</text><rect x="404" y="710" width="112" height="38" rx="6" fill="#087dff" stroke="#d7e0ed"/><text x="445" y="735" font-size="14" fill="#fff">保存</text><text x="604" y="101" font-size="22" fill="#16213e">预检</text><text x="604" y="155" font-size="18" fill="#16213e">ReShade · 6.8</text><text x="604" y="185" font-size="14" fill="#596883">尚未修改游戏文件。</text><rect x="604" y="212" width="462" height="65" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="620" y="238" font-size="16" fill="#16213e">dxgi.dll · 写入</text><text x="620" y="260" font-size="13" fill="#596883">D:\Games\Example\dxgi.dll</text><rect x="604" y="293" width="462" height="205" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="620" y="321" font-size="16" fill="#16213e">ReShade.ini · 写入</text><text x="620" y="349" font-size="15" fill="#16213e">配置改动</text><text x="620" y="377" font-size="13" fill="#16213e">[GENERAL] EffectSearchPaths</text><text x="620" y="399" font-size="12" fill="#596883">未设置 → .\reshade-shaders\Shaders\**</text><text x="620" y="432" font-size="13" fill="#16213e">[GENERAL] TextureSearchPaths</text><text x="620" y="454" font-size="12" fill="#596883">未设置 → .\reshade-shaders\Textures\**</text><text x="604" y="537" font-size="14" fill="#596883">备份原件后再部署。</text><text x="604" y="566" font-size="14" fill="#596883">清除部署时按记录恢复原件。</text><rect x="826" y="710" width="100" height="38" rx="6" fill="#fff" stroke="#d7e0ed"/><text x="861" y="735" font-size="14" fill="#16213e">取消</text><rect x="938" y="710" width="128" height="38" rx="6" fill="#087dff" stroke="#d7e0ed"/><text x="954" y="735" font-size="14" fill="#fff">备份并执行</text></g></svg>
