<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#19233d;font-size:16px}.title{font-size:28px;font-weight:600}.h{font-size:20px;font-weight:600}.muted{fill:#526581;font-size:14px}.card{fill:white;stroke:#d6deeb;rx:8}.field{fill:#fafbfc;stroke:#ccd6e3;rx:5}.button{fill:#edf3fa;stroke:#ccd6e3;rx:5}</style>
<rect width="1440" height="1000" fill="#f8fafc"/>
<text x="36" y="40" class="title">RHI-CS</text><text x="570" y="40">游戏</text><text x="670" y="40">资源库</text><text x="790" y="40" fill="#0078d4">设置</text>
<path d="M0 64H1440" stroke="#d6deeb"/>
<text x="40" y="118" class="title">设置</text><text x="40" y="150" class="muted">左侧设置，右侧直接制作；窄窗口上下排列。</text>
<rect x="40" y="176" width="780" height="162" class="card"/><text x="60" y="210" class="h">常规</text>
<text x="60" y="246">外观</text><text x="340" y="246">语言</text><rect x="60" y="260" width="260" height="44" class="field"/><text x="76" y="288">浅色 ▾</text><rect x="340" y="260" width="260" height="44" class="field"/><text x="356" y="288">简体中文 ▾</text><rect x="620" y="260" width="176" height="44" fill="#0078d4" rx="5"/><text x="688" y="288" style="fill:white">保存</text>
<rect x="40" y="354" width="780" height="172" class="card"/><text x="60" y="390" class="h">应用数据</text><text x="60" y="422" class="muted">首次使用程序旁的 Data，已有数据沿用原位置。</text><text x="60" y="460">C:\RHI-CS\Data</text><rect x="640" y="440" width="156" height="44" class="button"/><text x="670" y="468">打开文件夹</text><text x="60" y="504" class="muted">更新时保留数据目录；资源文件另行存放。</text>
<rect x="40" y="542" width="780" height="240" class="card"/><text x="60" y="578" class="h">修改保护副本</text><text x="60" y="610" class="muted">长期保留；原件备份与恢复快照另存，请勿当作缓存清理。</text><rect x="60" y="628" width="200" height="42" class="button"/><text x="84" y="655">打开修改保护副本</text><rect x="274" y="628" width="140" height="42" class="button"/><text x="304" y="655">重新统计</text><path d="M60 688H796" stroke="#d6deeb"/><text x="60" y="718">游戏名称 · 资源库名称</text><text x="60" y="748" class="muted">时间 · 原部署目录                    打开修改保护副本</text>
<text x="60" y="824" class="muted">来源与许可 · 打开许可文件夹</text>
<rect x="860" y="176" width="540" height="680" class="card"/><text x="884" y="220" class="title">制作离线 ReShade</text><text x="884" y="252" class="muted">在此制作，再到资源库添加输出文件夹。</text>
<text x="884" y="300">官方安装包</text><rect x="884" y="314" width="348" height="42" class="field"/><rect x="1244" y="314" width="132" height="42" class="button"/><text x="1264" y="341">选择文件</text><text x="900" y="341" class="muted">选择本地 EXE；不运行安装器</text>
<text x="884" y="394">位数</text><text x="1140" y="394">图形 API</text><rect x="884" y="408" width="236" height="42" class="field"/><rect x="1140" y="408" width="236" height="42" class="field"/><text x="900" y="436">64 位 ▾</text><text x="1156" y="436">DirectX 10/11/12 ▾</text>
<text x="884" y="488">输出位置</text><rect x="884" y="502" width="348" height="42" class="field"/><rect x="1244" y="502" width="132" height="42" class="button"/><text x="1252" y="530">浏览文件夹</text><text x="900" y="530" class="muted">选择输出父目录</text><text x="884" y="578">文件夹名称</text><rect x="884" y="592" width="492" height="42" class="field"/><text x="900" y="620">ReShade-x64-DXGI</text>
<text x="884" y="672" class="muted">生成 DLL 和基础 INI；成功后可打开输出目录。</text><text x="884" y="698" class="muted">不支持 Vulkan；不覆盖已有输出文件夹。</text><path d="M860 766H1400" stroke="#d6deeb"/><rect x="884" y="790" width="236" height="42" class="button"/><text x="984" y="817">重置</text><rect x="1140" y="790" width="236" height="42" fill="#0078d4" rx="5"/><text x="1240" y="817" style="fill:white">制作</text>
<path d="M0 918H1440" stroke="#d6deeb"/><text x="36" y="952" class="muted">就绪</text><text x="40" y="990" class="muted">浅／深色复用现有主题资源；间距 12–18 DIP，外边距 20–28 DIP；长路径换行、内容可滚动，表单固定操作不随提示移动。</text>
</svg>
