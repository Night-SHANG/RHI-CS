<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
<title>RHI-CS 游戏资源行及资源库操作区布局样板 r7，示例数据，尚未实现</title>
<defs><style>
text{font-family:'Microsoft YaHei UI','Microsoft YaHei','Segoe UI',sans-serif;font-size:14px;fill:#202d42}.title{font-size:25px;font-weight:600}.section{font-size:19px;font-weight:600}.muted{fill:#596579}.small{font-size:12px;fill:#596579}.panel{fill:#fff;stroke:#dce2e9}.field{fill:#fff;stroke:#cbd3dd}.btn{fill:#fafbfc;stroke:#cbd3dd}.center{text-anchor:middle}.line{stroke:#e4e8ef}.green{fill:#187745}.bold{font-weight:600}
.disabled{fill:#8a929d}.error{fill:#a23628}
</style><g id="check"><rect width="18" height="18" rx="3" fill="#fff" stroke="#8e99a8"/></g><g id="checked"><rect width="18" height="18" rx="3" fill="#0766b2"/><path d="m4 9 3 3 7-7" fill="none" stroke="white" stroke-width="1.8"/></g><g id="partial"><rect width="18" height="18" rx="3" fill="#0766b2"/><path d="M4 9H14" stroke="white" stroke-width="1.8"/></g><g id="chev"><path d="m-4-2 4 4 4-4" fill="none" stroke="#596579" stroke-width="1.4"/></g></defs>
<rect width="1440" height="1020" fill="#f5f7fa"/>
<text x="36" y="48" class="title">游戏页面 · 部署前后保持相同行高</text>
<text x="36" y="77" class="muted">沿用原有页面导航；下方只展示本次调整的资源区域。示例包含未部署、已部署、选择换版和缺失状态。</text>
<rect x="36" y="100" width="1368" height="486" rx="8" class="panel"/>
<text x="60" y="138" class="section">本地资源</text>
<rect x="60" y="158" width="1320" height="48" fill="#f1f4f8"/>
<use href="#partial" x="80" y="173"/><text x="124" y="188">资源库名称</text><text x="344" y="188">版本</text><text x="856" y="188">状态</text><text x="1012" y="188">操作</text>
<!-- All four content rows are 80 px high. The version hint has a reserved line in every state. -->
<use href="#check" x="80" y="237"/><text x="124" y="252">画面增强</text>
<text x="344" y="228" class="small">待部署版本</text><rect x="344" y="238" width="484" height="34" rx="4" class="field"/><text x="356" y="260">ReShade_Setup_6.8.0_Addon-DX-64</text><use href="#chev" x="808" y="255"/>
<text x="856" y="252" class="muted">未部署</text>
<rect x="1012" y="228" width="112" height="36" rx="4" class="btn"/><text x="1068" y="251" class="center">部署</text>
<path d="M60 286H1380" class="line"/>
<use href="#checked" x="80" y="317"/><text x="124" y="332">纹理资源</text>
<text x="344" y="308" class="small">当前：高清纹理 v2.1</text><rect x="344" y="318" width="484" height="34" rx="4" class="field"/><text x="356" y="340">高清纹理 v2.1</text><use href="#chev" x="808" y="335"/>
<text x="856" y="321" class="green">已部署</text><text x="856" y="344" class="small">目标一致</text>
<rect x="1012" y="308" width="112" height="36" rx="4" fill="#f5f6f8" stroke="#e4e8ef"/><text x="1068" y="331" class="center disabled">更换版本</text>
<rect x="1132" y="308" width="112" height="36" rx="4" class="btn"/><text x="1188" y="331" class="center">清除部署</text>
<rect x="1252" y="308" width="112" height="36" rx="4" class="btn"/><text x="1308" y="331" class="center">查看差异</text>
<path d="M60 366H1380" class="line"/>
<use href="#checked" x="80" y="397"/><text x="124" y="412">界面资源</text>
<text x="344" y="388" class="small">当前：界面 v1.0</text><rect x="344" y="398" width="484" height="34" rx="4" class="field"/><text x="356" y="420">界面 v1.1</text><use href="#chev" x="808" y="415"/>
<text x="856" y="401" class="green">已部署</text><text x="856" y="424" class="small">尚未核对</text>
<rect x="1012" y="388" width="112" height="36" rx="4" class="btn"/><text x="1068" y="411" class="center">更换版本</text>
<rect x="1132" y="388" width="112" height="36" rx="4" class="btn"/><text x="1188" y="411" class="center">清除部署</text>
<rect x="1252" y="388" width="112" height="36" rx="4" class="btn"/><text x="1308" y="411" class="center">查看差异</text>
<path d="M60 446H1380" class="line"/>
<g opacity="0.45"><use href="#check" x="80" y="477"/></g><text x="124" y="492">音效资源</text>
<text x="344" y="468" class="small">待部署版本</text><rect x="344" y="478" width="484" height="34" rx="4" class="field"/><text x="356" y="500">环境音效 v3.0</text><use href="#chev" x="808" y="495"/>
<text x="856" y="492" class="error">来源失联</text>
<rect x="1012" y="468" width="112" height="36" rx="4" fill="#f5f6f8" stroke="#e4e8ef"/><text x="1068" y="491" class="center disabled">部署</text>
<path d="M60 526H1380" class="line"/>
<text x="60" y="560" class="small">每行 80 px；版本信息固定两层，状态最多两行。禁用原因通过悬停及键盘焦点提示，不再新增一段文字撑高行。</text>
<text x="36" y="636" class="title">资源库页面 · 三个操作保持同排</text>
<rect x="36" y="660" width="1368" height="268" rx="8" class="panel"/>
<text x="60" y="697" class="section">版本</text>
<rect x="60" y="714" width="1320" height="46" fill="#f1f4f8"/>
<text x="76" y="743">版本名称</text><text x="428" y="743">资源文件目录</text><text x="884" y="743">状态</text><text x="1012" y="743">操作</text>
<text x="76" y="807">ReShade_Setup_6.8.0_Addon-DX-64</text>
<text x="428" y="807">F:\资源库\画面增强\ReShade-DX-64</text>
<text x="884" y="795" class="green">可用</text><text x="884" y="818" class="small">Launcher 使用中</text>
<rect x="1012" y="780" width="112" height="36" rx="4" class="btn"/><text x="1068" y="803" class="center">查看</text>
<rect x="1132" y="780" width="112" height="36" rx="4" fill="#f5f6f8" stroke="#e4e8ef"/><text x="1188" y="803" class="center disabled">移除版本</text>
<rect x="1252" y="780" width="112" height="36" rx="4" class="btn"/><text x="1308" y="803" class="center">打开资源目录</text>
<path d="M60 840H1380" class="line"/>
<text x="76" y="887">高清纹理 v2.1</text><text x="428" y="887">F:\资源库\纹理资源\高清纹理-v2.1</text><text x="884" y="887" class="green">可用</text>
<rect x="1012" y="860" width="112" height="36" rx="4" class="btn"/><text x="1068" y="883" class="center">查看</text>
<rect x="1132" y="860" width="112" height="36" rx="4" class="btn"/><text x="1188" y="883" class="center">移除版本</text>
<rect x="1252" y="860" width="112" height="36" rx="4" class="btn"/><text x="1308" y="883" class="center">打开资源目录</text>
<text x="36" y="961" class="muted">窄窗口：整张表统一切换布局；操作整组放在下一行，所有资源行同步增高，不按是否部署分别变化。</text>
<text x="36" y="990" class="small">视觉样板 r7 · 示例数据 · 目录与版本名称过长时省略，完整文本可通过提示与详情查看；尚未实现。</text>
</svg>
